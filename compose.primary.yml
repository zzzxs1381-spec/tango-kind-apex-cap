services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xfreedom}
      POSTGRES_USER: ${POSTGRES_USER:-xfreedom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${WG_IP:?WG_IP is required}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xfreedom} -d ${POSTGRES_DB:-xfreedom}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${WG_IP:?WG_IP is required}:6333:6333"
      - "${WG_IP:?WG_IP is required}:6334:6334"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: xfreedom/app:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      XF_NODE_NAME: ${XF_NODE_NAME:-core-primary}
      XF_RELEASE: ${XF_RELEASE:-main}
    ports:
      - "${WG_IP:?WG_IP is required}:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true

volumes:
  postgres_data:
  qdrant_data:
