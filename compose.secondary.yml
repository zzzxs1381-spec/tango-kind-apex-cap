services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: xfreedom/app:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      XF_NODE_NAME: ${XF_NODE_NAME:-core-secondary}
      XF_RELEASE: ${XF_RELEASE:-main}
    ports:
      - "${WG_IP:?WG_IP is required}:3000:3000"
