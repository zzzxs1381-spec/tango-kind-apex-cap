name: XFreedom Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - "scripts/google-play-upload.py"
      - "docs/android-**"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install stable Android 16 SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate Play uploader syntax
        run: python3 -m py_compile scripts/google-play-upload.py

      - name: Unit tests
        run: gradle -p android :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Create ephemeral release signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/xfreedom-ci-release.p12"
          PASSWORD="ci-only-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias xfreedom-ci \
            -keyalg RSA \
            -keysize 3072 \
            -validity 3650 \
            -dname "CN=XFreedom CI, OU=Ephemeral, O=XFreedom, C=US"
          echo "XFREEDOM_ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "XFREEDOM_ANDROID_STORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "XFREEDOM_ANDROID_KEY_ALIAS=xfreedom-ci" >> "$GITHUB_ENV"
          echo "XFREEDOM_ANDROID_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "XFREEDOM_ANDROID_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "XFREEDOM_ANDROID_VERSION_NAME=0.2.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        run: gradle -p android :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          sha256sum "$APK" "$AAB"

      - uses: actions/upload-artifact@v4
        with:
          name: xfreedom-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: xfreedom-android-ci-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 3
