name: XFreedom Android CI

on:
  push:
    branches:
      - xfreedom-android-superstack-plan
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - "docs/android-**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        run: gradle -p android :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: xfreedom-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
