name: XFreedom Android Signed Field Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (for example 0.2.0-field)"
        required: false
        default: "0.2.0-field"
      upload_to_play:
        description: "Upload the verified AAB to Google Play pre-release"
        type: boolean
        required: false
        default: false
      play_track:
        description: "Google Play pre-release track"
        type: choice
        required: false
        default: internal
        options:
          - internal
          - alpha
          - beta

permissions:
  contents: read

concurrency:
  group: xfreedom-android-signed-release
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Require persistent release signing material
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_UPLOAD_KEYSTORE_BASE64:?Missing ANDROID_UPLOAD_KEYSTORE_BASE64 GitHub Secret}"
          : "${ANDROID_UPLOAD_STORE_PASSWORD:?Missing ANDROID_UPLOAD_STORE_PASSWORD GitHub Secret}"
          : "${ANDROID_UPLOAD_KEY_ALIAS:?Missing ANDROID_UPLOAD_KEY_ALIAS GitHub Secret}"
          : "${ANDROID_UPLOAD_KEY_PASSWORD:?Missing ANDROID_UPLOAD_KEY_PASSWORD GitHub Secret}"

      - name: Install upload keystore into runner
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/xfreedom-upload-key.keystore"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$ANDROID_UPLOAD_STORE_PASSWORD" \
            -alias "$ANDROID_UPLOAD_KEY_ALIAS" >/dev/null

          echo "XFREEDOM_ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "XFREEDOM_ANDROID_STORE_PASSWORD=$ANDROID_UPLOAD_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "XFREEDOM_ANDROID_KEY_ALIAS=$ANDROID_UPLOAD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "XFREEDOM_ANDROID_KEY_PASSWORD=$ANDROID_UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "XFREEDOM_ANDROID_VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "XFREEDOM_ANDROID_VERSION_NAME=${{ inputs.version_name }}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle -p android :app:testDebugUnitTest --stacktrace

      - name: Build signed APK and AAB
        run: gradle -p android :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK and AAB signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null

          mkdir -p release-metadata
          sha256sum "$APK" "$AAB" | tee release-metadata/SHA256SUMS.txt
          keytool -exportcert \
            -keystore "$XFREEDOM_ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_UPLOAD_STORE_PASSWORD" \
            -alias "$ANDROID_UPLOAD_KEY_ALIAS" \
            -rfc > release-metadata/upload-certificate.pem
          keytool -printcert -file release-metadata/upload-certificate.pem > release-metadata/upload-certificate.txt

      - name: Upload AAB to Google Play pre-release track
        if: ${{ inputs.upload_to_play }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:?Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON GitHub Secret}"
          PLAY_KEY="$RUNNER_TEMP/google-play-service-account.json"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$PLAY_KEY"
          chmod 600 "$PLAY_KEY"
          python3 -m pip install --disable-pip-version-check --no-cache-dir "google-auth>=2.40,<3" "requests>=2.32,<3"
          python3 scripts/google-play-upload.py \
            --service-account "$PLAY_KEY" \
            --package app.xservis.xfreedom \
            --bundle android/app/build/outputs/bundle/release/app-release.aab \
            --track "${{ inputs.play_track }}" \
            --release-name "XFreedom $XFREEDOM_ANDROID_VERSION_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: xfreedom-android-signed-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            release-metadata/SHA256SUMS.txt
            release-metadata/upload-certificate.pem
            release-metadata/upload-certificate.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing and Play credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/xfreedom-upload-key.keystore"
          rm -f "$RUNNER_TEMP/google-play-service-account.json"
