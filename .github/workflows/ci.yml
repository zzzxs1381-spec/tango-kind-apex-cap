name: XFreedom CI

on:
  push:
    branches:
      - main
      - xfreedom-control-center
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Core tests
        run: node --experimental-strip-types --test src/lib/app-data/app-data.test.ts src/lib/app-data/readiness-schedule.test.ts src/lib/auth/gate-identity.test.ts src/lib/auth/sign-in-gate.test.ts
      - name: Vercel production build
        run: npm run build
      - name: VPS node_server production build
        env:
          NITRO_PRESET: node_server
        run: npm run build
      - name: Docker image build
        run: docker build -t xfreedom-ci .
      - name: Validate Compose roles
        run: |
          cat > .env <<'EOF'
          WG_IP=127.0.0.1
          XF_NODE_NAME=ci
          POSTGRES_DB=xfreedom
          POSTGRES_USER=xfreedom
          POSTGRES_PASSWORD=ci-only-password
          DATABASE_URL=postgresql://xfreedom:ci-only-password@postgres:5432/xfreedom
          EOF
          docker compose -f compose.primary.yml config >/dev/null
          docker compose -f compose.secondary.yml config >/dev/null
          docker compose -f compose.edge.yml config >/dev/null
          bash -n infra/bootstrap-node.sh infra/render-wireguard.sh infra/deploy-role.sh infra/watchdog.sh infra/rkn/node-bootstrap.sh infra/rkn/configure-node.sh infra/rkn/cluster-bootstrap.sh
          rm -f .env
      - name: Docker runtime smoke test
        run: |
          docker run -d --name xfreedom-ci-run -p 18080:3000 xfreedom-ci
          trap 'docker logs xfreedom-ci-run || true; docker rm -f xfreedom-ci-run || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
