name: AI stack smoke

on:
  pull_request:
    paths:
      - 'infra/ai-stack/**'
      - '.agents/skills/xfreedom-goose-worker/**'
      - '.github/workflows/ai-stack-smoke.yml'
  push:
    branches:
      - 'ai-agent-*'
    paths:
      - 'infra/ai-stack/**'
      - '.agents/skills/xfreedom-goose-worker/**'
      - '.github/workflows/ai-stack-smoke.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/ai-stack/goose-worker/package-lock.json

      - name: Bash syntax
        run: |
          bash -n infra/ai-stack/install-linux.sh
          bash -n infra/ai-stack/healthcheck-linux.sh
          bash -n infra/ai-stack/security/quarantine-linux.sh
          bash -n infra/ai-stack/security/security-check-linux.sh

      - name: PowerShell parse
        shell: pwsh
        run: |
          $files = @(
            'infra/ai-stack/install-windows.ps1',
            'infra/ai-stack/healthcheck-windows.ps1',
            'infra/ai-stack/security/quarantine-windows.ps1',
            'infra/ai-stack/security/security-check-windows.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Security auditor self-test
        run: |
          node --check infra/ai-stack/security/audit-mcp.mjs
          node -e "JSON.parse(require('fs').readFileSync('infra/ai-stack/security/policy.json','utf8'))"
          node infra/ai-stack/security/audit-mcp.mjs --self-test

      - name: Goose MCP bridge tests
        run: |
          npm --prefix infra/ai-stack/goose-worker ci --ignore-scripts
          npm --prefix infra/ai-stack/goose-worker test

      - name: Guard against committed private keys
        shell: bash
        run: |
          if grep -RInE --exclude='stack.env.example' \
            --exclude-dir='node_modules' \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sk-[A-Za-z0-9_-]{20,}|mnemonic[[:space:]]*=[[:space:]]*[^#[:space:]])' \
            infra/ai-stack; then
            echo 'Potential secret material found in infra/ai-stack' >&2
            exit 1
          fi
