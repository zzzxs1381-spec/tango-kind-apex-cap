name: Android Open Edition
on:
  workflow_dispatch:
  push:
    branches: [codex/android-foundation-20260911]
    paths: ['apps/android/**', 'infra/solo/android_profile.py', 'infra/solo/test_android_profile.py', '.github/workflows/android-open.yml']
permissions:
  contents: read
concurrency:
  group: android-open-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Profile regression checks
        run: python3 -m unittest discover -s infra/solo -p 'test_android_profile.py' -v
      - name: Prepare exact upstream source and XFreedom changes
        run: python3 apps/android/prepare.py --output .android-build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: .android-build/sing-box/go.sum
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-37.1' 'build-tools;37.0.0' 'ndk;28.0.13004108'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native library and ARM64 APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: bash apps/android/build.sh .android-build
      - uses: actions/upload-artifact@v4
        with:
          name: XFreedom-0.1.0-android-arm64-debug
          path: apps/android/dist/*
          if-no-files-found: error
          retention-days: 30
