name: xfreedom-solo
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: xfreedom
      POSTGRES_USER: xfreedom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xfreedom -d xfreedom']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?required}
      QDRANT__TELEMETRY_DISABLED: 'true'
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    logging: *logging
  app:
    image: ${XF_APP_IMAGE:?required}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?required}
      XF_NODE_NAME: solo
      XF_RELEASE: ${XF_RELEASE:?required}
      XF_RUNTIME_STATUS: /run/xfreedom/status.json
      HOST: 0.0.0.0
      PORT: '3000'
    volumes:
      - /var/lib/xfreedom-solo/status:/run/xfreedom:ro
    ports:
      - '127.0.0.1:8080:3000'
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *logging
volumes:
  postgres_data:
  qdrant_data:
  qdrant_snapshots:
